<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoliSpace - Daftar Akaun</title>
  <link rel="icon" href="/resources/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/resources/css/style.css?v=20260923-account-types">
  <style>
    .signup-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
      background:
        radial-gradient(ellipse 50% 40% at 50% 40%, rgba(201,168,76,0.08), transparent 65%),
        var(--bg-main);
    }

    .signup-card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 42px 40px;
      box-shadow: var(--shadow);
    }

    .signup-head {
      text-align: center;
      margin-bottom: 28px;
    }

    .signup-icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(145deg, var(--gold), #b3943a);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      margin: 0 auto 18px;
    }

    .signup-title {
      font-family: var(--display-font);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    .signup-sub {
      color: var(--grey-4);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 auto;
      max-width: 340px;
    }

    .signup-error {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: #FDECEC;
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
    }

    .signup-error.show { display: block; }

    .signup-grid {
      display: grid;
      gap: 14px;
    }

    .account-type-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .account-type-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .account-type-option:has(input:checked) {
      border-color: var(--gold);
      background: color-mix(in srgb, var(--gold) 10%, transparent);
    }

    .account-type-option input { accent-color: var(--gold); }

    .signup-card .btn-primary {
      width: 100%;
      justify-content: center;
      margin-top: 22px;
      padding: 15px;
      border-radius: 60px;
      background: linear-gradient(145deg, var(--gold), #b3943a);
    }

    .signup-link {
      margin-top: 18px;
      text-align: center;
      color: var(--grey-4);
      font-size: 13px;
    }

    .signup-link a {
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav id="main-nav">
    <div class="nav-logo" onclick="window.location.href='/resources/views/welcome.html'">
      <div class="nav-logo-mark"></div>
      <div><div class="nav-logo-text">PoliSpace</div><div class="nav-logo-sub">Fasiliti</div></div>
    </div>
    <div class="nav-links">
      <button class="nav-link" onclick="window.location.href='/resources/views/welcome.html'">Laman Utama</button>
      <button class="nav-link" onclick="window.location.href='/resources/views/booking/index.html'">Tempahan</button>
      <button class="nav-link" onclick="window.location.href='/resources/views/dashboard/index.html'">Dashboard</button>
    </div>
    <div class="nav-actions"></div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <main class="signup-page" id="signup-page">
    <section class="signup-card" aria-label="Daftar akaun pelanggan">
      <div class="signup-head">
        <div class="signup-icon"></div>
        <h1 class="signup-title">Daftar Akaun</h1>
        <p class="signup-sub">Cipta akaun pelanggan dahulu untuk membuat dan mengurus tempahan fasiliti.</p>
      </div>

      <div class="signup-error" id="signupError"></div>

      <form onsubmit="event.preventDefault(); doSignup();">
        <div class="signup-grid">
          <div class="form-group">
            <label>Nama</label>
            <input type="text" id="signup-name" autocomplete="name">
          </div>
          <div class="form-group">
            <label>No Telefon</label>
            <input type="tel" id="signup-phone" autocomplete="tel">
          </div>
          <div class="form-group">
            <label>Jenis Akaun</label>
            <div class="account-type-options" role="radiogroup" aria-label="Jenis Akaun">
              <label class="account-type-option"><input type="radio" name="signup-account-type" value="public" checked onchange="toggleSignupAccountType()"> Orang Awam</label>
              <label class="account-type-option"><input type="radio" name="signup-account-type" value="staff" onchange="toggleSignupAccountType()"> Kakitangan</label>
            </div>
          </div>
          <div class="form-group" id="signupStaffNumberGroup" hidden>
            <label>No. Kakitangan</label>
            <input type="text" id="signup-staff-number" minlength="2" maxlength="50" pattern="[A-Za-z0-9._/-]+" autocomplete="off" placeholder="Masukkan nombor kakitangan">
            <small>Permohonan akaun kakitangan perlu disahkan oleh pentadbir.</small>
          </div>
          <div class="form-group">
            <label>Alamat E-mel</label>
            <input type="email" id="signup-email" autocomplete="username">
          </div>
          <div class="form-group">
            <label>Kata Laluan</label>
            <input type="password" id="signup-password" autocomplete="new-password" placeholder="Minimum 6 aksara">
          </div>
          <div class="form-group">
            <label>Sahkan Kata Laluan</label>
            <input type="password" id="signup-password-confirm" autocomplete="new-password">
          </div>
        </div>
        <button class="btn btn-primary" type="submit"><i class="bi bi-person-plus"></i> Daftar Akaun</button>
      </form>

      <div class="signup-link">Sudah ada akaun? <a href="/resources/views/auth/login.html">Log masuk</a></div>
    </section>
  </main>

  <script src="/resources/js/script.js?v=20260923-account-types"></script>
</body>
</html>
