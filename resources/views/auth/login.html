<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoliSpace - Log Masuk</title>
  <link rel="icon" href="/resources/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/resources/css/style.css?v=20260924-admin-table-fit">
</head>
<body>
  <nav id="main-nav">
    <div class="nav-logo" onclick="window.location.href='/resources/views/welcome.html'">
      <div class="nav-logo-mark"></div>
      <div><div class="nav-logo-text">PoliSpace</div><div class="nav-logo-sub">Fasiliti</div></div>
    </div>
    <div class="nav-links">
      <button class="nav-link" onclick="window.location.href='/resources/views/welcome.html'">Laman Utama</button>
      <button class="nav-link" onclick="window.location.href='/resources/views/booking/index.html'">Tempahan</button>
      <button class="nav-link" onclick="window.location.href='/resources/views/dashboard/index.html'">Dashboard</button>
    </div>
    <div class="nav-actions"></div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <main class="login-page">
    <section class="unified-login-card" aria-label="Log masuk PoliSpace">
      <div class="unified-login-head">
        <div class="unified-login-icon"></div>
        <h1 class="unified-login-title">Log Masuk</h1>
        <p class="unified-login-sub">Masukkan e-mel dan kata laluan. Sistem akan mengesan akaun admin atau pelanggan secara automatik.</p>
      </div>

      <div class="login-error" id="loginError">E-mel atau kata laluan tidak sah.</div>

      <form onsubmit="event.preventDefault(); doAutoLogin();">
        <div class="form-group">
          <label for="login-email"><i class="bi bi-envelope"></i> Alamat E-mel</label>
          <input type="email" id="login-email" placeholder="nama@email.com" autocomplete="username">
        </div>
        <div class="form-group login-password-group">
          <label for="login-password"><i class="bi bi-lock"></i> Kata Laluan</label>
          <input type="password" id="login-password" placeholder="Masukkan kata laluan" autocomplete="current-password">
        </div>

        <button class="btn btn-primary auth-primary" id="authLoginButton" type="submit">
          <i class="bi bi-box-arrow-in-right"></i> Log Masuk
        </button>
      </form>

      <div class="login-helper">
        <i class="bi bi-info-circle"></i>
        <span>Pelanggan perlu mempunyai akaun dan log masuk sebelum membuat tempahan.</span>
      </div>
      <div class="signup-login-link">Belum ada akaun? <a href="/resources/views/auth/signup.html">Daftar akaun</a></div>
    </section>
  </main>

  <script src="/resources/js/script.js?v=20260924-admin-table-fixes"></script>
</body>
</html>
