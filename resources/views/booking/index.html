<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoliSpace - Tempahan</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/resources/css/style.css?v=20260804-availability-lock-3">
</head>
<body>
  <nav id="main-nav">
    <div class="nav-logo" onclick="window.location.href='/resources/views/welcome.html'">
      <div class="nav-logo-mark"></div>
      <div><div class="nav-logo-text">PoliSpace</div><div class="nav-logo-sub">Fasiliti</div></div>
    </div>
    <div class="nav-links">
      <button class="nav-link" onclick="window.location.href='/resources/views/welcome.html'">Laman Utama</button>
      <button class="nav-link active" onclick="window.location.href='/resources/views/booking/index.html'">Tempahan</button>
      <button class="nav-link" onclick="window.location.href='/resources/views/dashboard/index.html'">Dashboard</button>
    </div>
    <div class="nav-actions"></div>
  </nav>
  <div class="toast-container" id="toastContainer"></div>

  <div id="booking" class="view active page-transition">
    <div class="booking-layout">
      <div class="booking-form-section">
        <div id="booking-form-wrap">
          <h1 class="page-title">Borang Tempahan</h1>
          <p class="page-subtitle">Sila lengkapkan semua maklumat yang diperlukan.</p>
          <div class="form-section">
            <div class="form-section-title">01 - Maklumat Pengguna</div>
            <div class="form-grid">
              <div class="form-group"><label>Nama *</label><input class="booking-readonly" type="text" id="f-name" placeholder="cth: Ahmad bin Ali" readonly></div>
              <div class="form-group"><label>No Telefon *</label><input class="booking-readonly" type="tel" id="f-phone" placeholder="012-345 6789" readonly></div>
              <div class="form-group"><label>Alamat E-mel *</label><input class="booking-readonly" type="email" id="f-email" placeholder="contoh@email.com" readonly></div>
            </div>
          </div>
          <div class="form-section">
            <div class="form-section-title">02 - Butiran Tempahan</div>
            <div class="form-grid">
              <div class="form-group span-2">
                <label>Nama Fasiliti *</label>
                <div class="form-select-wrap">
                  <select id="f-facility"></select>
                  <i class="bi bi-chevron-down"></i>
                </div>
              </div>
              <div class="form-group span-2">
                <label>Tarikh Tempahan *</label>
                <div class="booking-date-input-wrap">
                  <input type="date" id="f-date">
                  <button type="button" class="booking-date-toggle" onclick="toggleBookingDatePicker()" aria-label="Buka kalendar ketersediaan">
                    <i class="bi bi-calendar3"></i>
                  </button>
                </div>
                <div class="booking-date-picker" id="bookingDatePicker"></div>
              </div>
              <div class="form-group span-2">
                <label>Masa Mula *</label>
                <div class="time-input-wrap">
                  <input type="time" id="f-start">
                  <button type="button" class="time-picker-toggle" onclick="toggleStartTimePicker()" aria-label="Buka pilihan masa">
                    <i class="bi bi-clock"></i>
                  </button>
                </div>
                <input type="hidden" id="f-end">
              </div>
              <div class="form-group span-2">
                <label>Tempoh Penggunaan</label>
                <div class="duration-field">
                  <div class="duration-input-wrap" role="group" aria-label="Tempoh penggunaan dalam jam">
                    <button type="button" class="duration-step-button" onclick="adjustDuration(-1)" aria-label="Kurangkan tempoh penggunaan">
                      <i class="bi bi-dash-lg"></i>
                    </button>
                    <input type="number" id="f-duration" min="1" max="24" step="1" value="1" inputmode="numeric" aria-label="Tempoh penggunaan dalam jam">
                    <span class="duration-unit">Jam</span>
                    <button type="button" class="duration-step-button" onclick="adjustDuration(1)" aria-label="Tambah tempoh penggunaan">
                      <i class="bi bi-plus-lg"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="form-group span-2"><label>Tujuan Penggunaan *</label><textarea id="f-purpose"></textarea></div>
              <div class="form-group span-2">
                <label>Peralatan Diperlukan</label>
                <div class="equipment-field">
                  <input type="hidden" id="f-equipment">
                  <div class="equipment-add-row">
                    <div class="equipment-select-wrap">
                      <select id="equipmentAddSelect" aria-label="Pilih peralatan"></select>
                      <i class="bi bi-chevron-down"></i>
                    </div>
                    <button type="button" class="equipment-add-button" onclick="addEquipmentItem()" aria-label="Tambah peralatan">
                      <i class="bi bi-plus-lg"></i> Tambah
                    </button>
                  </div>
                  <div class="equipment-list" id="equipmentList"></div>
                </div>
              </div>
              <div class="form-group span-2"><label>Jumlah Pengguna *</label><div class="quantity-control"><button type="button" onclick="adjustParticipantCount('f-participants', -1)" aria-label="Kurangkan jumlah pengguna"><i class="bi bi-dash-lg"></i></button><input type="number" id="f-participants" min="1" step="1" value="1"><button type="button" onclick="adjustParticipantCount('f-participants', 1)" aria-label="Tambah jumlah pengguna"><i class="bi bi-plus-lg"></i></button></div></div>
            </div>
          </div>
          <div class="form-section">
            <div class="form-section-title">03 - Resit Bayaran</div>
            <div class="form-grid">
              <div class="form-group span-2">
                <label>Resit / Bukti Bayaran</label>
                <label class="upload-zone" for="f-receipt">
                  <input type="file" id="f-receipt" accept="image/jpeg,image/png,image/gif,application/pdf">
                  <div class="upload-icon"><i class="bi bi-receipt"></i></div>
                  <div class="upload-title">Muat naik resit sekarang atau kemudian</div>
                  <div class="upload-sub">Format JPG, PNG, GIF atau PDF. Maksimum 5MB.</div>
                </label>
                <div class="upload-preview" id="receiptPreview">
                  <i class="bi bi-file-earmark-check"></i>
                  <div class="upload-preview-name" id="receiptFileName"></div>
                  <button type="button" class="upload-preview-remove" onclick="clearReceiptUpload()" aria-label="Buang resit"><i class="bi bi-x-lg"></i></button>
                </div>
              </div>
            </div>
          </div>
          <div class="booking-submit-actions">
            <button class="btn btn-secondary booking-cart-add-button" id="addToCartButton" type="button" onclick="addBookingToCart()">
              <i class="bi bi-cart-plus"></i>
              <span>Tambah ke Troli</span>
            </button>
            <button class="btn btn-primary booking-submit-button" type="button" onclick="submitBooking()">
              Hantar Permohonan <i class="bi bi-arrow-right ms-2"></i>
            </button>
          </div>
        </div>
        <div class="success-screen" id="successScreen">
          <div class="success-icon" style="color: var(--gold);"><i class="bi bi-stars"></i></div>
          <h2 class="success-title">Permohonan Dihantar!</h2>
          <div class="booking-ref"><div class="booking-ref-label">Nombor Rujukan</div><div class="booking-ref-code" id="refCode"></div></div>
          <div class="success-actions">
            <button class="btn btn-primary" onclick="window.location.href='/resources/views/dashboard/index.html'"><i class="bi bi-speedometer2"></i> Dashboard</button>
            <button class="btn btn-secondary" onclick="resetBookingForm()"><i class="bi bi-calendar-plus"></i> Tempahan Baru</button>
          </div>
        </div>
      </div>
      <div class="booking-sidebar">
        <div class="sidebar-card"><div class="sidebar-title">Fasiliti Pilihan</div><div class="facility-select-list" id="facilitySelectorList"></div></div>
        <div class="sidebar-card cost-card"><div class="sidebar-title">Anggaran Kos</div><div id="pricingBreakdown"></div></div>
      </div>
    </div>
  </div>
  <script src="/resources/js/script.js?v=20260804-availability-lock-3"></script>
</body>
</html>
